<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta name="referrer" content="no-referrer" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamHub Vision</title>
    
    <!-- Polyfill for globalThis (Android 4.4) -->
    <script>
      if (typeof globalThis === 'undefined') { window.globalThis = window; }
    </script>

   <!-- Polyfills for Android 4.4 / Chrome < 50 -->
    <script src="/js/minified.js"></script>
    <script src="/js/fetch.min.js"></script>
    <script src="/js/abortcontroller-polyfill-only.js"></script>
    <script src="/js/url-polyfill.min.js"></script>

    <script>
      // Initialize theme immediately to prevent FOUC
      try {
        if (localStorage.getItem('streamhub_theme') === 'dark' || (!('streamhub_theme' in localStorage) && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { console.error(e); } 

      // Polyfill for Tailwind CDN configuration if needed
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              display: ['"Noto Sans SC"', 'Inter', 'sans-serif'],
              sans: ['"Noto Sans SC"', 'Inter', 'sans-serif'],
            },
            colors: {
            },
            animation: {
              fadeIn: 'fadeIn 0.5s ease-in-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
            },
          },
        },
      };
    </script>
    <script src="/js/tailwind.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round|Material+Icons+Outlined" rel="stylesheet" />
    
    <!-- Player Dependencies -->
    <script src="/js/hls.min.js"></script>
    <script src="/js/artplayer.js"></script>

    <style>
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      body {
        transition-property: background-color, color;
        transition-duration: 300ms;
      }
      .art-context-menu {
          backdrop-filter: blur(10px);
      }
      /* Fallback for backdrop-filter on old Android */
      @supports not (backdrop-filter: blur(10px)) {
        .backdrop-blur-md, .backdrop-blur-sm, .backdrop-blur-xl {
          background-color: rgba(0, 0, 0, 0.9) !important;
        }
        .dark .backdrop-blur-md, .dark .backdrop-blur-sm, .dark .backdrop-blur-xl {
          background-color: rgba(30, 41, 59, 0.95) !important;
        }
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "url": "https://esm.sh/url@^0.11.4",
    "@vitejs/plugin-legacy": "https://esm.sh/@vitejs/plugin-legacy@^7.2.1"
  }
}
</script>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-gray-100 antialiased min-h-screen transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
